<!doctype html>
<html lang="en" data-theme="clear-day">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e6a147" />
    <meta name="color-scheme" content="light dark" />

    <title>Broadsheet | Meteorological Dispatch</title>
    <meta name="description" content="An editorial print-inspired meteorological broadsheet for Android with instant offline launch and ruled telemetry." />

    <!-- PWA & Android Meta Tags -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register Service Worker for offline app shell caching
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.warn('SW registration bypassed:', err);
          });
        });
      }
    </script>
  </body>
</html>
